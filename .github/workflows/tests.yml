name: Python unit tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and complete offline test dependencies
        run: python -m pip install -e '.[all,mlflow]' pytest-cov
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run tests and generate coverage
        run: python -m pytest -q --cov=urbantwin --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Verify release structure
        run: python scripts/verify_release.py

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
